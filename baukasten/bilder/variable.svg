<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" role="img" aria-labelledby="bvTitel">
  <title id="bvTitel">Eine Kiste mit der Aufschrift «Zähler». Ein Pfeil mit dem Zeichen «=» bringt die Zahl 3 in die Kiste.</title>
  <defs>
    <linearGradient id="bvPfeil" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" class="bv-gelb"/>
      <stop offset="1" class="bv-orange"/>
    </linearGradient>
  </defs>
  <!-- Deckel, hinten aufgeklappt -->
  <polygon class="bv-innen bv-linie" points="40,100 115,85 102,18 24,32"/>
  <polygon class="bv-kante bv-linie" points="24,32 102,18 106,12 30,25"/>
  <!-- Öffnung und Innenwände -->
  <polygon class="bv-innen bv-linie" points="40,100 115,85 185,105 110,122"/>
  <path class="bv-linie" d="M115 85 L114 112"/>
  <!-- Vorderseiten -->
  <polygon class="bv-karton bv-linie" points="40,100 110,122 108,205 43,183"/>
  <polygon class="bv-karton-hell bv-linie" points="110,122 185,105 180,188 108,205"/>
  <text class="bv-aufschrift" x="146" y="160" transform="rotate(-13 146 160)" text-anchor="middle">Zähler</text>
  <!-- Pfeil mit «=» -->
  <path class="bv-umriss" d="M322 120 C305 58 228 38 178 70"/>
  <path class="bv-band" d="M322 120 C305 58 228 38 178 70"/>
  <polygon class="bv-spitze bv-linie" points="154,88 190,84 168,54"/>
  <g transform="rotate(-6 262 60)">
    <path class="bv-gleich" d="M251 55.5 H273 M251 64.5 H273"/>
  </g>
  <!-- Wert -->
  <text class="bv-wert" x="312" y="205" text-anchor="middle">3</text>
</svg>
